name: ci/cd pipeline

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Nodejs installation.
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'
          
      - name: "Install dependencies"
        run: yarn install

      - name: "Run Build"
        run: "yarn build"